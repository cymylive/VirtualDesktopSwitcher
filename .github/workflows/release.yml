name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1

      - name: Build
        run: xmake build -y

      - name: Package executable
        shell: pwsh
        run: |
          Move-Item build\windows\x86\release\VirtualDesktopSwitcher.exe "VirtualDesktopSwitcher-${{ github.ref_name }}.exe"
          Get-ChildItem VirtualDesktopSwitcher-*.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: VirtualDesktopSwitcher-*.exe
          generate_release_notes: true
          draft: false
